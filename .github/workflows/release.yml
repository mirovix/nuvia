name: Release

# Push a tag like v0.6.0 to build every platform and publish a GitHub Release,
# or run it by hand with a tag name: the release then creates that tag on the
# commit it was run on.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and publish (e.g. v0.6.14); empty = build only'
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm test
      # Widevine on Windows and macOS needs a castlabs VMP signature, or Spotify
      # stops after a few seconds (issue #1). Signed with the castlabs EVS
      # account in the EVS_ACCOUNT_NAME / EVS_PASSWD secrets (scripts/after-pack.cjs).
      - name: VMP signing (castlabs EVS)
        id: vmp
        if: runner.os != 'Linux'
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          if [ -z "$EVS_ACCOUNT_NAME" ] || [ -z "$EVS_PASSWD" ]; then
            echo "::warning::No castlabs EVS account (EVS_ACCOUNT_NAME, EVS_PASSWD): the ${{ runner.os }} build is not VMP-signed and Spotify will not play in it."
            exit 0
          fi
          python3 -m pip install --upgrade castlabs-evs || python -m pip install --upgrade castlabs-evs
          python3 -m castlabs_evs.account -n reauth || python -m castlabs_evs.account -n reauth
          echo "sign=1" >> "$GITHUB_OUTPUT"
      - name: Build packages
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No Apple/Windows code-signing certificates: build unsigned (but VMP-signed).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NUVIA_VMP_SIGN: ${{ steps.vmp.outputs.sign }}
      - uses: actions/upload-artifact@v4
        with:
          name: nuvia-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - run: ls -la packages && (cd packages && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          name: Nuvia ${{ inputs.tag || github.ref_name }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: packages/*
