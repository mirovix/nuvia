<!doctype html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <title>Claude</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="chat-page">
  <header class="chat-head drag">
    <span class="chat-mark" data-icon="sparkles"></span>
    <div class="chat-title"><strong id="chat-title">Claude</strong><small id="chat-sub"></small></div>
    <button class="icon-btn small no-drag" id="chat-close" title="Close (Esc)" data-icon="x"></button>
  </header>
  <blockquote class="chat-context" id="chat-context" hidden></blockquote>
  <div class="chat-log" id="chat-log" aria-live="polite"></div>
  <div class="chat-chips" id="chat-chips" hidden></div>
  <form class="chat-input" id="chat-form">
    <textarea id="chat-text" rows="1" placeholder="Ask a follow-up…"></textarea>
    <button class="icon-btn" id="chat-send" type="submit" title="Send (Enter)" data-icon="send"></button>
  </form>
  <script type="module" src="ui/chat.js"></script>
</body>
</html>
