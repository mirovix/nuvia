<!doctype html><html><head><meta charset="utf-8"><title>University Mail</title></head>
<body>
<!-- A service whose session lives in the SSO: without it, it sends you to sso.nuvia.test. -->
<script>
  const params = new URLSearchParams(location.search);
  if (params.get('ticket') === 'ok') { localStorage.setItem('session', '1'); history.replaceState(null, '', '/'); }
  if (localStorage.getItem('session') !== '1') location.href = 'https://sso.nuvia.test/idp/login';
  else document.body.innerHTML = '<h1>Inbox</h1><p>3 new messages</p>';
</script>
</body></html>
